<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">随看：从视频到笔记的四步操作</title><desc id="desc">分享或打开视频，提取完整字幕，选择总结程度，核对并保存笔记。</desc>
<rect width="1200" height="300" rx="24" fill="#f8f6fa"/>
<g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">
<text x="36" y="46" font-size="24" font-weight="700" fill="#24212e">从视频到笔记，只需四步</text>
<text x="36" y="76" font-size="14" fill="#797382">只想要字幕？做到第二步，就可以复制或保存全文。</text>
<g fill="#fff" stroke="#e5dfeb"><rect x="30" y="106" width="264" height="162" rx="18"/><rect x="322" y="106" width="264" height="162" rx="18"/><rect x="614" y="106" width="264" height="162" rx="18"/><rect x="906" y="106" width="264" height="162" rx="18"/></g>
