<g fill="#27232f" font-size="20" font-weight="700"><text x="88" y="145">选择视频</text><text x="380" y="145">提取全文</text><text x="672" y="145">生成总结</text><text x="964" y="145">回看与保存</text></g>
<g fill="#777080" font-size="15"><text x="50" y="190">安卓：从 B 站分享链接</text><text x="50" y="219">浏览器：打开浮窗或侧栏</text><text x="342" y="190">核对视频与分 P</text><text x="342" y="219">完整字幕，独立滚动阅读</text><text x="634" y="190">简洁 / 标准 / 详细</text><text x="634" y="219">使用你配置的模型 API</text><text x="926" y="190">核对字幕依据</text><text x="926" y="219">复制、导出、查看历史</text></g>
